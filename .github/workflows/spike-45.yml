name: Issue 45 dataset-artifact spike

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Logical profile rows for the native Linux benchmark
        required: false
        default: "1048576"
        type: string
      embedding_width:
        description: Fixed FLOAT embedding width
        required: false
        default: "256"
        type: string
      memory_limit:
        description: DuckDB memory limit
        required: false
        default: "256MiB"
        type: string
      repetitions:
        description: Measured benchmark executions after one warm-up
        required: false
        default: "3"
        type: string
      run_benchmark:
        description: Run Gate 2 only after the uploaded Gate 1 evidence has been reviewed
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  macos-functional:
    name: macOS ARM64 functional gate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          cli: "1.12.5.1654"
          bb: "1.12.218"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: spike-45-m2-${{ runner.os }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: spike-45-m2-${{ runner.os }}-
      - name: Record platform
        run: |
          uname -a
          java -version
          test "$(uname -m)" = "arm64"
      - name: Run bounded functional gate
        run: bb spike:45 check --rows 512 --embedding-width 16 --batch-rows 64 --output-dir target/spike-45/macos-functional
      - name: Upload functional evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spike-45-macos-functional
          path: |
            dev/spikes/issue-45/target/spike-45/macos-functional/**/*.edn
            dev/spikes/issue-45/target/spike-45/macos-functional/**/profiles/*.json
            dev/spikes/issue-45/target/spike-45/macos-functional/**/*.log
          if-no-files-found: warn

  linux-gate-and-benchmark:
    name: Linux AMD64 gate and benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          cli: "1.12.5.1654"
          bb: "1.12.218"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: spike-45-m2-${{ runner.os }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: spike-45-m2-${{ runner.os }}-
      - name: Record native Linux platform
        run: |
          uname -a
          docker info
          java -version
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
      - id: gate
        name: Run all bounded Gate 1 checks
        shell: bash
        run: |
          set +e
          bb spike:45 check --rows 512 --embedding-width 16 --batch-rows 64 --output-dir target/spike-45/linux/direct
          check_status=$?
          bb spike:45 s3-check --rows 128 --embedding-width 16 --batch-rows 32 --output-dir target/spike-45/linux/s3
          s3_status=$?
          bb spike:45 docker-check --output-dir target/spike-45/linux/docker
          docker_status=$?
          set -e
          echo "check=${check_status}" >> "$GITHUB_OUTPUT"
          echo "s3=${s3_status}" >> "$GITHUB_OUTPUT"
          echo "docker=${docker_status}" >> "$GITHUB_OUTPUT"
      - id: benchmark
        name: Measure surviving candidates after Gate 1
        if: inputs.run_benchmark && steps.gate.outputs.check == '0' && steps.gate.outputs.s3 == '0' && steps.gate.outputs.docker == '0'
        shell: bash
        run: |
          set +e
          bb spike:45 benchmark \
            --rows "${{ inputs.rows }}" \
            --embedding-width "${{ inputs.embedding_width }}" \
            --memory-limit "${{ inputs.memory_limit }}" \
            --repetitions "${{ inputs.repetitions }}" \
            --output-dir target/spike-45/linux/benchmark
          benchmark_status=$?
          set -e
          echo "status=${benchmark_status}" >> "$GITHUB_OUTPUT"
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spike-45-linux-amd64
          path: |
            dev/spikes/issue-45/target/spike-45/linux/**/*.edn
            dev/spikes/issue-45/target/spike-45/linux/**/profiles/*.json
            dev/spikes/issue-45/target/spike-45/linux/**/*.log
          if-no-files-found: warn
      - name: Enforce Gate 1
        if: steps.gate.outputs.check != '0' || steps.gate.outputs.s3 != '0' || steps.gate.outputs.docker != '0'
        run: |
          echo "Issue #45 Gate 1 failed; native measurement is intentionally skipped."
          exit 1
      - name: Enforce Gate 2
        if: inputs.run_benchmark && steps.benchmark.outcome == 'success' && steps.benchmark.outputs.status != '0'
        run: |
          echo "Issue #45 Gate 2 rejected at least one hard candidate; see uploaded EDN evidence."
          exit 1
